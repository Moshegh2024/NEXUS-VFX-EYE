name: NEXUS VFX EYE Android CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GRADLE_VERSION: '8.11.1'
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
jobs:
  android-debug:
    name: Build + Verify Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"
      - name: Verify source tree before build
        run: bash ci/android_ci.sh prebuild
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace --warning-mode=all :app:assembleDebug
      - name: Verify APK package, version and structure
        run: bash ci/android_ci.sh verify-apk
      - name: Generate build evidence
        run: bash ci/android_ci.sh evidence
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-vfx-eye-android-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            ci/artifacts/**